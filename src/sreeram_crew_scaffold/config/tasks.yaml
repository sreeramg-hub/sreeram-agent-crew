  agent: silver_agent

compose_digest_task:
  description: >
    You receive the gold and silver video reports. Write an HTML fragment for
    the "Gold & Silver" part of a daily email. The email template already adds
    the page, the prices and the disclaimer, so do NOT write <html>, <head>,
    <body>, prices, or a disclaimer.
    Use only these tags: h3, p, ul, li, a, strong, em.
    Structure:
      <h3>Gold</h3> then a <ul> with one <li> per video, or a <p> saying there
      are no new videos; then <h3>Silver</h3> in the same way.
    Each <li>: <a href="VIDEO_URL">Title</a> — Channel, date, followed by the
    attributed sentence if the report has one.
    If the same video appears in both reports, list it once, under the metal it
    fits best. Keep every link exactly as given. If a report says some channels
    could not be checked, keep one short neutral line saying so ("Some channels
    could not be checked today.") and give no advice about channel IDs or access.
    Do NOT call any tools. Output raw HTML only — no markdown code fences.
  expected_output: >
    Raw HTML fragment only: an h3 "Gold" and an h3 "Silver" section, each with a
    list of linked videos or a "no new videos" line. No code fences, no commentary.
  output_file: metals.html
  agent: final_agent
  context:
    - gold_research_task
    - silver_research_task
