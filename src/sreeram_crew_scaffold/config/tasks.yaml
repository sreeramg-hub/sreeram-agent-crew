gold_research_task:
  description: >
    Find today's new gold videos. Use youtube_new_uploads with metal="gold" and
    channel_ids="{gold_channel_ids}".
    Videos are NOT transcribed — you only know each video's title, channel,
    date, link and the channel-written description. For each video, list it
    with its link and, only if the description says something useful, one short
    sentence paraphrasing the description (attribute it: "The channel's
    description says ..."). Never state what was said in the video, and never
    present a title or description as fact.
    If a tool result says some channels could not be checked, say so.
    If no new videos are found, say so explicitly.
  expected_output: >
    A markdown list of new videos. For each: channel name, title as a markdown
    link to the video URL, date, and at most one attributed sentence based on
    the description. "No new videos today" if there are none.
  agent: gold_agent

