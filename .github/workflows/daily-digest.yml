name: Daily Digest

on:
  schedule:
    # 14:00 UTC = 8:00 AM CST / 9:00 AM CDT
    - cron: "0 14 * * *"
  workflow_dispatch:  # allow manual trigger for testing

jobs:
  run-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write  # needed to commit state files back

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install Python + dependencies
        run: uv sync

      - name: Run crew
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: anthropic/claude-sonnet-4-6
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_RECIPIENT_EMAIL: ${{ secrets.DIGEST_RECIPIENT_EMAIL }}
          GOLD_CHANNEL_IDS: ${{ vars.GOLD_CHANNEL_IDS }}
          SILVER_CHANNEL_IDS: ${{ vars.SILVER_CHANNEL_IDS }}
        run: uv run crewai run

      - name: Commit updated state files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state
          git diff --staged --quiet || git commit -m "chore: update seen-video state [skip ci]"
          git push
